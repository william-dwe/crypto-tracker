version: 2

models:
  - name: stg_coin_prices_daily
    description: "Cleansed daily price history. Grain: (coin_id, price_date)."
    columns:
      - name: coin_id
        data_tests: [not_null]
      - name: price_date
        description: UTC calendar day. Today is excluded until it closes.
        data_tests: [not_null]
      - name: price_usd
        data_tests: [not_null]
