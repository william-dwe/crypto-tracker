version: 2

sources:
  - name: coin_gecko
    # dlt owns these raw tables in bronze; dbt reads them but never writes them.
    schema: bronze
    tables:
      - name: coins_markets_raw
        description: >
          Point-in-time market snapshot from /coins/markets, one row per coin per
          pipeline run. Append-only; never edited in place.
        loaded_at_field: _ingested_at
        freshness:
          warn_after: {count: 26, period: hour}
      - name: coin_market_chart_raw
        description: >
          Daily price/market-cap/volume history from /coins/{id}/market_chart,
          merged on (coin_id, price_ts_ms).
