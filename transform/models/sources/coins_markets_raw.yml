version: 2

sources:
  - name: bronze
    description: >
      dlt's landing zone, shared with dbt's trust-filter views. dlt owns the
      `*_raw` source tables plus its bookkeeping (`_dlt_loads`, `_dlt_version`,
      `_dlt_pipeline_state`) and the `bronze_staging` schema for merge loads.
      dbt adds the `br_*` views over the source tables in the same schema.
    schema: bronze
    tables:
      - name: coins_markets_raw
        description: >
          Point-in-time market snapshot from /coins/markets, one row per coin per
          pipeline run. Append-only; never edited in place.
        loaded_at_field: _ingested_at
        freshness:
          warn_after: {count: 26, period: hour}
